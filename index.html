<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة-الڨرارم ڨوڨة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma}
body{height:110vh;display:flex;justify-content:center;align-items:center;background:url("background3.jpg") no-repeat center/cover fixed}
.overlay{width:95%;max-width:420px;background:rgba(0,0,0,.3);border-radius:18px;padding:15px;text-align:center;color:#fff;transform:scale(.9);transform-origin:center top}
.logo{width:80px;margin-bottom:6px}
.title{font-size:20px;font-weight:700;margin:6px 0}
.date{margin:2px 0;font-size:14px;font-weight:700}

.news-bar{background:gold;color:#000;font-weight:700;padding:8px 0;border-radius:12px;margin-bottom:10px;overflow:hidden}
.news-text{white-space:nowrap;display:inline-block;animation:scrollNews 25s linear infinite}
@keyframes scrollNews{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.table{margin-top:10px}
.row{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.25);font-weight:700}

/* نبض هادئ */
.row.nextPrayer{
  background:gold;
  color:#000;
  border-radius:12px;
  animation:softGlow 2.5s ease-in-out infinite;
}
@keyframes softGlow{
  0%{box-shadow:0 0 5px rgba(255,215,0,0.4);}
  50%{box-shadow:0 0 15px rgba(255,215,0,0.8);}
  100%{box-shadow:0 0 5px rgba(255,215,0,0.4);}
}

/* نبض قوي قبل 10 دقائق */
.row.nextPrayer.activeSoon{
  animation:strongGlow 1s ease-in-out infinite;
}
@keyframes strongGlow{
  0%{box-shadow:0 0 15px rgba(255,215,0,0.8);}
  50%{box-shadow:0 0 30px rgba(255,215,0,1);}
  100%{box-shadow:0 0 15px rgba(255,215,0,0.8);}
}

#countdownText{font-size:24px;font-weight:700;margin:6px 0;color:gold}
#nextPrayerClockContainer{border:2px solid gold;border-radius:10px;padding:6px 12px;box-shadow:0 0 10px rgba(255,215,0,.6);display:flex;align-items:center;justify-content:center;gap:8px}
#nextPrayerClock{font-size:30px}
.footer{margin-top:10px;font-size:14px}
</style>
</head>

<body>
<div class="overlay">

<div class="news-bar">
<div class="news-text">
تعلن الجمعية الخيرية مسك الختام بالتنسيق مع إمام مسجد عبد الحميد ابن باديس عن إنطلاق قفة رمضان لفائدة العائلات المعوزة
</div>
</div>

<div class="title">الجمعية الخيرية مسك الختام القرارم قوقة</div>

<div class="date" id="gregorian">--</div>
<div class="date" id="hijri">--</div>

<div id="countdownText">-- بعد:</div>
<div id="nextPrayerClockContainer">
<div id="nextPrayerClock">--:--:--</div>
</div>

<div class="table" id="prayerTable"></div>
<div class="footer">misk elkhithem ©</div>

</div>

<script>
const TABLE_START_DATE=new Date("2026-02-01T00:00:00");
const HIJRI_START_DATE=new Date("2026-02-18T00:00:00");

/* جدول كامل بدون تغيير */
let prayerSchedule = [/* ضع هنا جدولك الكامل */];

/* تبديل الإمساك مع الفجر للعرض */
prayerSchedule = prayerSchedule.map(day => [day[1], day[0], day[2], day[3], day[4], day[5]]);

const prayerNames=["الإمساك","الفجر","الظهر","العصر","المغرب","العشاء"];
const hijriMonths=["محرم","صفر","ربيع الأول","ربيع الثاني","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];

let rows=[],todayTimes=[];
const $=id=>document.getElementById(id);

function updateHijri(){
  const today=new Date();today.setHours(0,0,0,0);
  let diff=Math.floor((today-HIJRI_START_DATE)/86400000);
  let d=1+diff,m=8,y=1447;
  while(d>30){d-=30;m++;if(m>11){m=0;y++;}}
  $("hijri").innerText=`${d} ${hijriMonths[m]} ${y} هـ`;
}

function buildTable(){
  const c=$("prayerTable");c.innerHTML="";rows=[];
  prayerNames.forEach((n,i)=>{
    const r=document.createElement("div");
    r.className="row";
    r.innerHTML=`<span>${n}</span><span id="t${i}">--:--</span>`;
    c.appendChild(r);rows.push(r);
  });
}

function updateDateAndTimes(){
  const now=new Date();
  $("gregorian").innerText=now.toLocaleDateString("ar-DZ",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  updateHijri();
  const diff=Math.floor((now-TABLE_START_DATE)/86400000);
  const i=Math.min(Math.max(diff,0),prayerSchedule.length-1);
  todayTimes=prayerSchedule[i];
  todayTimes.forEach((t,i)=>$("t"+i).innerText=t);
}

function updateCountdown(){
  if(!todayTimes.length) return;
  const now=new Date();
  rows.forEach(r=>{r.classList.remove("nextPrayer");r.classList.remove("activeSoon");});
  let target,index=-1,found=false;

  for(let i=0;i<todayTimes.length;i++){
    if(i===0) continue; // تخطي الإمساك
    const [h,m]=todayTimes[i].split(":").map(Number);
    const t=new Date();t.setHours(h,m,0,0);
    if(t>now){target=t;index=i;found=true;break;}
  }

  if(!found){
    const tomorrow=new Date(now);tomorrow.setDate(tomorrow.getDate()+1);
    const diff=Math.floor((tomorrow-TABLE_START_DATE)/86400000);
    const i=Math.min(Math.max(diff,0),prayerSchedule.length-1);
    const [h,m]=prayerSchedule[i][1].split(":").map(Number);
    target=new Date(now);target.setDate(target.getDate()+1);target.setHours(h,m,0,0);
    index=1;
  }

  rows[index].classList.add("nextPrayer");

  // قبل 10 دقائق، نبض أقوى
  const diffMinutes=(target-now)/60000;
  if(diffMinutes<=10) rows[index].classList.add("activeSoon");

  const d=target-now;
  $("countdownText").innerText=`${prayerNames[index]} بعد:`;
  $("nextPrayerClock").innerText=
    `${String(Math.floor(d/3600000)).padStart(2,"0")}:`+
    `${String(Math.floor(d%3600000/60000)).padStart(2,"0")}:`+
    `${String(Math.floor(d%60000/1000)).padStart(2,"0")}`;
}

buildTable();
updateDateAndTimes();
updateCountdown();
setInterval(updateCountdown,1000);
setInterval(updateDateAndTimes,60000);
</script>
</body>
</html>
