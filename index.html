<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma;}
body{
  height:110vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:no-repeat center center fixed;
  background-size:cover;
  transition: background-image 1.5s ease-in-out;
}
.overlay{
  width:95%;
  max-width:420px;
  background:rgba(0,0,0,0.50);
  border-radius:18px;
  padding:15px;
  text-align:center;
  color:white;
  transform: scale(0.9);
  transform-origin: center top;
}

.logo{width:80px;margin-bottom:6px;}

/* 🔽 زر آخر الأخبار */
.latest-news-btn{
  display:block;
  width:90%;
  margin:10px auto;
  padding:12px;
  background:black;
  border-radius:12px;
  font-size:16px;
  font-weight:900;
  color:white;
  cursor:pointer;
  border:2px solid gold;
  position:relative;
  overflow:hidden;
  z-index:1;
  animation:btnPulse 2s infinite;
}

.latest-news-btn:hover{
  transform: scale(1.05);
}

@keyframes btnPulse{
  0%{box-shadow:0 0 5px gold;}
  50%{box-shadow:0 0 20px gold;}
  100%{box-shadow:0 0 5px gold;}
}

/* 🔽 العناوين */
.title{
  font-size:20px;
  font-weight:700;
  margin:6px 0;
}
.date{
  margin:2px 0;
  font-size:14px;
  font-weight:700;
}

/* جدول الصلاة */
.table{margin-top:10px}
.row{
  display:flex;
  justify-content:space-between;
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,.25);
  font-weight:700;
}
.row.nextPrayer{
  background:gold;
  color:black;
  border-radius:12px;
}

/* العد التنازلي */
#countdownText{
  font-size:24px;
  font-weight:700;
  margin:6px 0;
  color:gold;
  text-shadow:0 0 8px rgba(255,215,0,.8);
}
#nextPrayerClockContainer{
  border:2px solid gold;
  border-radius:10px;
  padding:6px 12px;
  box-shadow:0 0 15px rgba(255,215,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
#nextPrayerClock{font-size:30px;}
#nextPrayerClockContainer img{
  width:35px;
  height:35px;
}

/* Footer */
.footer{
  margin-top:10px;
  font-size:14px;
  display:flex;
  justify-content:center;
  gap:6px;
}
</style>
</head>

<body>
