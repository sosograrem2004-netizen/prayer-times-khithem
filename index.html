<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة - ميلة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma;}

body{
  height:110vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:no-repeat center center fixed;
  background-size:cover;
  transition: background-image 1.5s ease-in-out;
}

.overlay{
  width:95%;
  max-width:420px;
  background:rgba(0,0,0,0.50);
  border-radius:18px;
  padding:15px;
  text-align:center;
  color:white;
}

.logo{
  width:80px;
  margin-bottom:8px;
}

/* ===== زر الأخبار ===== */
.news-btn-wrapper{
  background:rgba(0,0,0,0.6);
  padding:8px;
  border-radius:14px;
  margin-bottom:8px;
}

.news-btn{
  display:block;
  background:white;
  color:black;
  font-weight:900;
  font-size:15px;
  padding:10px;
  border-radius:12px;
  text-decoration:none;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,.9);}
  70%{box-shadow:0 0 25px 12px rgba(255,255,255,0);}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
}

/* ===== العناوين ===== */
.title{
  font-size:20px;
  font-weight:700;
  margin-bottom:4px;
}

.date{
  margin:2px 0;
  font-size:14px;
  font-weight:700;
}

.table{margin-top:10px}

.row{
  display:flex;
  justify-content:space-between;
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,.25);
  font-weight:700;
}

.row.nextPrayer{
  background:gold;
  color:black;
  border-radius:12px;
}

/* ===== العد التنازلي ===== */
#countdownText{
  font-size:22px;
  font-weight:700;
  margin:6px 0;
  color:gold;
}

#nextPrayerClockContainer{
  border:2px solid gold;
  border-radius:10px;
  padding:6px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

#nextPrayerClock{
  font-size:28px;
}

.footer{
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="overlay">

  <img src="logo.png" class="logo" alt="لوغو الجمعية">

  <!-- زر الأخبار -->
  <div class="news-btn-wrapper">
    <a href="news-grarem.html" class="news-btn">
      آخر أخبار مسك الختام
    </a>
  </div>

  <div class="title">الجمعية الخيرية مسك الختام القرارم قوقة</div>

  <div class="date" id="gregorian">--</div>
  <div class="date" id="hijri">--</div>

  <div id="countdownText">-- بعد:</div>

  <div id="nextPrayerClockContainer">
    <div id="nextPrayerClock">--:--:--</div>
  </div>

  <div class="table" id="prayerTable"></div>

  <div class="footer">
    misk elkhithem ©
  </div>

</div>

<script>
/* ===== بيانات المواقيت ===== */
const TABLE_START_DATE = new Date("2026-02-01T00:00:00");

const prayerSchedule = [
  ["06:09","05:59","12:49","15:40","18:04","19:25"],
  ["06:08","05:58","12:49","15:41","18:05","19:26"],
  ["06:07","05:57","12:49","15:42","18:07","19:27"],
  ["06:06","05:56","12:49","15:43","18:09","19:28"]
];

const prayerNames=["الفجر","الإمساك","الظهر","العصر","المغرب","العشاء"];
let rows=[], todayTimes=[];

/* ===== التاريخ ===== */
function updateDate(){
  const now=new Date();
  document.getElementById("gregorian").innerText=
    now.toLocaleDateString("ar-DZ",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}

/* ===== الجدول ===== */
function buildTable(){
  const c=document.getElementById("prayerTable");
  prayerNames.forEach((n,i)=>{
    const r=document.createElement("div");
    r.className="row";
    r.innerHTML=`<span>${n}</span><span id="t${i}">--:--</span>`;
    c.appendChild(r);
    rows.push(r);
  });
}

/* ===== تحديث المواقيت ===== */
function updateTimes(){
  const now=new Date();
  const diffDays=Math.floor((now-TABLE_START_DATE)/86400000);
  todayTimes=prayerSchedule[Math.max(0,Math.min(diffDays,prayerSchedule.length-1))];
  todayTimes.forEach((t,i)=>document.getElementById("t"+i).innerText=t);
}

/* ===== العد التنازلي ===== */
function updateCountdown(){
  const now=new Date();
  rows.forEach(r=>r.classList.remove("nextPrayer"));

  let target=null,index=-1;
  for(let i=0;i<todayTimes.length;i++){
    if(i===1)continue;
    const [h,m]=todayTimes[i].split(":");
    const t=new Date();t.setHours(h,m,0,0);
    if(t>now){target=t;index=i;break;}
  }

  if(!target)return;

  rows[index].classList.add("nextPrayer");
  const diff=target-now;
  document.getElementById("countdownText").innerText=`${prayerNames[index]} بعد:`;
  document.getElementById("nextPrayerClock").innerText=
    `${String(Math.floor(diff/3600000)).padStart(2,"0")}:`+
    `${String(Math.floor(diff%3600000/60000)).padStart(2,"0")}:`+
    `${String(Math.floor(diff%60000/1000)).padStart(2,"0")}`;
}

/* ===== الخلفية ===== */
function updateBackground(){
  const h=new Date().getHours();
  document.body.style.backgroundImage =
    (h>=19||h<7)?'url("background1.png")':'url("background3.png")';
}

/* ===== تشغيل ===== */
buildTable();
updateDate();
updateTimes();
updateCountdown();
updateBackground();

setInterval(updateCountdown,1000);
setInterval(updateDate,60000);
setInterval(updateBackground,60000);
</script>

</body>
</html>
