<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة - ميلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma;}
body{
  height:110vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:no-repeat center center fixed;
  background-size:cover;
  transition: background-image 1.5s ease-in-out;
}
.overlay{
  width:95%;
  max-width:420px;
  background:rgba(0,0,0,0.50);
  border-radius:18px;
  padding:15px;
  text-align:center;
  color:white;
  transform: scale(0.9);
  transform-origin: center top;
}

.logo{width:80px;margin-bottom:6px;}

/* 🔽 العناوين */
.title{
  font-size:20px;
  font-weight:700;
  margin-bottom:2px;
}
.date{
  margin:2px 0;
  font-size:14px;
  font-weight:700;
}

.table{margin-top:10px}
.row{
  display:flex;
  justify-content:space-between;
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,.25);
  font-weight:700;
}
.row.nextPrayer{
  background:gold;
  color:black;
  border-radius:12px;
}

/* ===== العد التنازلي ===== */
#countdownText{
  font-size:24px;
  font-weight:700;
  margin:6px 0;
  color:gold;
}
#nextPrayerClockContainer{
  border:2px solid gold;
  border-radius:10px;
  padding:6px 12px;
  box-shadow:0 0 15px rgba(255,215,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
#nextPrayerClock{font-size:30px;}
#nextPrayerClockContainer img{
  width:35px;
  height:35px;
}

/* ===== زر الأخبار ===== */
#newsBtn{
  margin:10px 0;
  padding:10px 12px;
  background:white;
  color:black;
  font-weight:900;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  box-shadow:0 0 10px gold;
  animation:blink 2s infinite;
}
@keyframes blink{
  0%,50%,100%{box-shadow:0 0 10px gold,0 0 20px gold,0 0 30px gold;}
  25%,75%{box-shadow:0 0 20px gold,0 0 30px gold,0 0 40px gold;}
}

/* ===== شريط الأخبار ===== */
#newsTicker{
  width:100%;
  overflow:hidden;
  white-space:nowrap;
  border-radius:8px;
  margin:5px 0 10px 0;
  background:rgba(0,0,0,0.2);
  padding:5px 0;
  font-weight:700;
  font-size:16px;
  position:relative;
  color:gold;
}
#newsTicker span{
  display:inline-block;
  position:relative;
  left:-100%;
  animation:scrollLeft 20s linear infinite;
}
@keyframes scrollLeft{
  0%{left:-100%;}
  100%{left:100%;}
}

.footer{
  margin-top:10px;
  font-size:14px;
  display:flex;
  justify-content:center;
  gap:6px;
}
</style>
</head>

<body>

<div class="overlay">

  <img src="logo.png" class="logo" alt="لوغو الجمعية">

  <!-- زر الأخبار -->
  <div id="newsBtn" onclick="window.location.href='news-misk.html'">
    آخر أخبار مسك الختام
  </div>

  <!-- شريط الأخبار -->
  <div id="newsTicker">
    <span>
      🌙 صيام أيام البيض | 📖 خبر كتابي 2 | 📰 خبر كتابي 3
    </span>
  </div>

  <div class="title">الجمعية الخيرية مسك الختام القرارم قوقة</div>
  <div class="date" id="gregorian">--</div>
  <div class="date" id="hijri">--</div>

  <div id="countdownText">-- بعد:</div>
  <div id="nextPrayerClockContainer">
    <img src="logo.webp" alt="جرس">
    <div id="nextPrayerClock">--:--:--</div>
  </div>

  <div class="table" id="prayerTable"></div>

  <div class="footer">
    <span>misk elkhithem ©</span>
  </div>

</div>

<script>
// ===== بيانات مواقيت الصلاة =====
const TABLE_START_DATE = new Date("2026-02-01T00:00:00");
const prayerSchedule = [
  ["06:09","05:59","12:49","15:40","18:04","19:25"],
  ["06:08","05:58","12:49","15:41","18:05","19:26"]
];
const prayerNames=["الفجر","الإمساك","الظهر","العصر","المغرب","العشاء"];
let rows=[], todayTimes=[];

// ===== التاريخ الهجري =====
const HIJRI_START_DATE=new Date("2026-02-01T00:00:00");
const hijriMonths=["محرم","صفر","ربيع الأول","ربيع الثاني","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];

function updateHijri(){
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.floor((today-HIJRI_START_DATE)/86400000);
  let d=13+diff,m=7,y=1447;
  while(d>30){d-=30;m++;if(m>11){m=0;y++;}}
  document.getElementById("hijri").innerText=`${d} ${hijriMonths[m]} ${y} هـ`;
}

// ===== بناء جدول المواقيت =====
function buildTable(){
  const c=document.getElementById("prayerTable");
  c.innerHTML="";
  rows=[];
  prayerNames.forEach((n,i)=>{
    const r=document.createElement("div");
    r.className="row";
    r.innerHTML=`<span>${n}</span><span id="t${i}">--:--</span>`;
    c.appendChild(r);
    rows.push(r);
  });
}

// ===== تحديث التاريخ والوقت =====
function updateDateAndTimes(){
  const now=new Date();
  document.getElementById("gregorian").innerText=
    now.toLocaleDateString("ar-DZ",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  updateHijri();
  const diffDays=Math.floor((now-TABLE_START_DATE)/86400000);
  const index=Math.min(Math.max(diffDays,0),prayerSchedule.length-1);
  todayTimes=prayerSchedule[index];
  todayTimes.forEach((t,i)=>document.getElementById("t"+i).innerText=t);
}

// ===== العد التنازلي للصلاة القادمة =====
function updateCountdown(){
  if(!todayTimes.length) return;
  const now = new Date();
  rows.forEach(r => r.classList.remove("nextPrayer"));
  let target = null, index = -1;
  for(let i = 0; i < todayTimes.length; i++){
    if(i === 1) continue; 
    const [h,m] = todayTimes[i].split(":").map(Number);
    const t = new Date(); t.setHours(h,m,0,0);
    if(t > now){target=t; index=i; break;}
  }
  if(!target){index=0;}
  rows[index].classList.add("nextPrayer");
  const diff = target-now;
  if(diff <= 0) return;
  document.getElementById("countdownText").innerText = `${prayerNames[index]} بعد:`;
  document.getElementById("nextPrayerClock").innerText =
    `${String(Math.floor(diff/3600000)).padStart(2,"0")}:`+
    `${String(Math.floor(diff%3600000/60000)).padStart(2,"0")}:`+
    `${String(Math.floor(diff%60000/1000)).padStart(2,"0")}`;
}

// ===== تبديل الخلفية نهار / ليل =====
function updateBackground(){
  const now = new Date();
  const hour = now.getHours();
  if(hour >= 19 || hour < 7){
    document.body.style.backgroundImage = 'url("background1.png")';
  } else {
    document.body.style.backgroundImage = 'url("background3.png")';
  }
}

// ===== التشغيل =====
buildTable();
updateDateAndTimes();
updateCountdown();
updateBackground();
setInterval(updateCountdown,1000);
setInterval(updateDateAndTimes,60000);
setInterval(updateBackground,60000);
</script>

</body>
</html>
