<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة - ميلة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma;}
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background-color:#000;
  color:white;
}
.overlay{
  width:95%;
  max-width:420px;
  background:rgba(0,0,0,0.75);
  border-radius:18px;
  padding:15px;
  text-align:center;
}
#newsButton{
  display:block;
  width:100%;
  padding:10px 0;
  font-size:16px;
  font-weight:700;
  color:white;
  background-color:black;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:8px;
}
.title{
  font-size:20px;
  font-weight:700;
  color:gold;
  margin-bottom:5px;
}
.date{font-size:14px;margin:2px 0;}
.table{margin-top:10px;}
.row{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.25);}
.row.nextPrayer{background:gold;color:black;border-radius:12px;}
#countdownText{font-size:24px;font-weight:700;margin:6px 0;color:gold;}
#nextPrayerClockContainer{border:2px solid gold;border-radius:10px;padding:6px 12px;display:flex;align-items:center;justify-content:center;gap:8px;}
#nextPrayerClock{font-size:30px;}
.footer{margin-top:10px;font-size:14px;display:flex;justify-content:center;gap:6px;color:gold;}
</style>
</head>
<body>

<div class="overlay">

  <a href="news-grarem.html" id="newsButton">آخر أخبار مسك الختام</a>

  <div class="title">الجمعية الخيرية مسك الختام القرارم قوقة</div>
  <div class="date" id="gregorian">--</div>
  <div class="date" id="hijri">--</div>

  <div id="countdownText">-- بعد:</div>
  <div id="nextPrayerClockContainer">
    <div id="nextPrayerClock">--:--:--</div>
  </div>

  <div class="table" id="prayerTable"></div>

  <div class="footer">misk elkhithem ©</div>
</div>

<script>
// ===== مواقيت الصلاة =====
const TABLE_START_DATE = new Date("2026-02-01T00:00:00");
const prayerSchedule = [
  ["06:09","05:59","12:49","15:40","18:04","19:25"],
  ["06:08","05:58","12:49","15:41","18:05","19:26"],
  ["06:07","05:57","12:49","15:42","18:07","19:27"],
  ["06:07","05:57","12:49","15:42","18:08","19:27"],
  ["06:06","05:56","12:49","15:43","18:09","19:28"],
  ["06:05","05:55","12:49","15:44","18:10","19:29"],
  ["06:04","05:54","12:50","15:45","18:11","19:30"]
];
const prayerNames=["الفجر","الإمساك","الظهر","العصر","المغرب","العشاء"];
let rows=[], todayTimes=[];

function buildTable(){
  const c=document.getElementById("prayerTable");
  c.innerHTML="";
  rows=[];
  prayerNames.forEach((n,i)=>{
    const r=document.createElement("div");
    r.className="row";
    r.innerHTML=`<span>${n}</span><span id="t${i}">--:--</span>`;
    c.appendChild(r);
    rows.push(r);
  });
}

function updateDateAndTimes(){
  const now=new Date();
  document.getElementById("gregorian").innerText=
    now.toLocaleDateString("ar-DZ",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  const diffDays=Math.floor((now-TABLE_START_DATE)/86400000);
  const index=Math.min(Math.max(diffDays,0), prayerSchedule.length-1);
  todayTimes=prayerSchedule[index];
  todayTimes.forEach((t,i)=>document.getElementById("t"+i).innerText=t);
}

function updateCountdown(){
  if(!todayTimes.length) return;
  const now=new Date();
  rows.forEach(r => r.classList.remove("nextPrayer"));
  let target=null,index=-1;
  for(let i=0;i<todayTimes.length;i++){
    if(i===1) continue;
    const [h,m]=todayTimes[i].split(":").map(Number);
    const t=new Date(); t.setHours(h,m,0,0);
    if(t>now){target=t;index=i;break;}
  }
  if(!target){
    const tomorrow=new Date();
    tomorrow.setDate(tomorrow.getDate()+1);
    target=new Date(tomorrow.getFullYear(),tomorrow.getMonth(),tomorrow.getDate(),6,9,0);
    index=0;
  }
  rows[index].classList.add("nextPrayer");
  const diff=target-now;
  document.getElementById("countdownText").innerText=`${prayerNames[index]} بعد:`;
  document.getElementById("nextPrayerClock").innerText=
    `${String(Math.floor(diff/3600000)).padStart(2,"0")}:${String(Math.floor(diff%3600000/60000)).padStart(2,"0")}:${String(Math.floor(diff%60000/1000)).padStart(2,"0")}`;
}

buildTable();
updateDateAndTimes();
updateCountdown();
setInterval(updateCountdown,1000);
setInterval(updateDateAndTimes,60000);
</script>
</body>
</html>
