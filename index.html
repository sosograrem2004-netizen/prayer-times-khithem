<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة - ميلة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma;}

body{
  height:110vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:no-repeat center center fixed;
  background-size:cover;
}

.overlay{
  width:95%;
  max-width:420px;
  background:rgba(0,0,0,0.50);
  border-radius:18px;
  padding:15px;
  text-align:center;
  color:white;
}

/* اللوغو */
.logo{
  width:80px;
  margin-bottom:8px;
}

/* شريط أسود خفيف */
.news-bar{
  width:100%;
  height:6px;
  background:rgba(0,0,0,0.6);
  border-radius:10px;
  margin-bottom:8px;
}

/* زر الأخبار */
.news-btn{
  display:block;
  width:100%;
  padding:12px;
  background:white;
  color:black;
  font-size:16px;
  font-weight:900;
  border-radius:14px;
  text-decoration:none;
  animation:pulse 2s infinite;
  box-shadow:0 0 20px rgba(255,255,255,0.9);
  margin-bottom:10px;
}

@keyframes pulse{
  0%{transform:scale(1); box-shadow:0 0 15px rgba(255,255,255,.8);}
  50%{transform:scale(1.08); box-shadow:0 0 35px rgba(255,255,255,1);}
  100%{transform:scale(1); box-shadow:0 0 15px rgba(255,255,255,.8);}
}

/* العنوان */
.title{
  font-size:20px;
  font-weight:700;
  margin-bottom:4px;
}

.date{
  font-size:14px;
  font-weight:700;
}

/* جدول المواقيت */
.table{margin-top:10px}
.row{
  display:flex;
  justify-content:space-between;
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,.25);
  font-weight:700;
}
.row.nextPrayer{
  background:gold;
  color:black;
  border-radius:12px;
}

/* العد التنازلي */
#countdownText{
  font-size:22px;
  font-weight:700;
  margin:6px 0;
  color:gold;
}
#nextPrayerClock{
  font-size:28px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="overlay">

  <img src="logo.png" class="logo" alt="لوغو الجمعية">

  <!-- الشريط الأسود -->
  <div class="news-bar"></div>

  <!-- زر الأخبار -->
  <a href="news-grarem.html" class="news-btn">
    آخر أخبار مسك الختام
  </a>

  <div class="title">الجمعية الخيرية مسك الختام القرارم قوقة</div>
  <div class="date" id="gregorian">--</div>

  <div id="countdownText">-- بعد:</div>
  <div id="nextPrayerClock">--:--:--</div>

  <div class="table" id="prayerTable"></div>

</div>

<script>
const prayerNames=["الفجر","الإمساك","الظهر","العصر","المغرب","العشاء"];
const prayerTimes=["06:09","05:59","12:49","15:40","18:04","19:25"];

const table=document.getElementById("prayerTable");

prayerNames.forEach((n,i)=>{
  table.innerHTML+=`
    <div class="row">
      <span>${n}</span>
      <span>${prayerTimes[i]}</span>
    </div>`;
});

document.getElementById("gregorian").innerText=
  new Date().toLocaleDateString("ar-DZ",{weekday:"long",year:"numeric",month:"long",day:"numeric"});

function countdown(){
  const now=new Date();
  const target=new Date();
  target.setHours(18,4,0,0);
  const diff=target-now;
  if(diff>0){
    document.getElementById("nextPrayerClock").innerText=
      `${String(Math.floor(diff/3600000)).padStart(2,"0")}:`+
      `${String(Math.floor(diff%3600000/60000)).padStart(2,"0")}:`+
      `${String(Math.floor(diff%60000/1000)).padStart(2,"0")}`;
  }
}
setInterval(countdown,1000);

/* الخلفية */
const hour=new Date().getHours();
document.body.style.backgroundImage=
  hour>=19||hour<7 ? 'url("background1.png")' : 'url("background3.png")';
</script>

</body>
</html>
