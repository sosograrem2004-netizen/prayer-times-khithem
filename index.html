<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة - ميلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma;}
body{
  height:110vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:no-repeat center center fixed;
  background-size:cover;
  transition: background-image 1.5s ease-in-out;
}
.overlay{
  width:95%;
  max-width:420px;
  background:rgba(0,0,0,0.50);
  border-radius:18px;
  padding:15px;
  text-align:center;
  color:white;
  transform: scale(0.9);
  transform-origin: center top;
}
.logo{width:80px;margin-bottom:6px;}
.title{
  font-size:20px;
  font-weight:700;
  margin-bottom:2px;
}
.date{
  margin:2px 0;
  font-size:14px;
  font-weight:700;
}
.table{margin-top:10px}
.row{
  display:flex;
  justify-content:space-between;
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,.25);
  font-weight:700;
}
.row.nextPrayer{
  background:gold;
  color:black;
  border-radius:12px;
}
#countdownText{
  font-size:24px;
  font-weight:700;
  margin:6px 0;
  color:gold;
}
#nextPrayerClockContainer{
  border:2px solid gold;
  border-radius:10px;
  padding:6px 12px;
  box-shadow:0 0 15px rgba(255,215,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
#nextPrayerClock{font-size:30px;}
#nextPrayerClockContainer img{width:35px;height:35px;}

/* ===== زر آخر الأخبار ===== */
#newsButton{
  margin:10px 0;
  padding:10px 15px;
  background:#000;
  color:white;
  border-radius:12px;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
  display:inline-block;
  position:relative;
  overflow:hidden;
  z-index:1;
}
#newsButton::before{
  content:"";
  position:absolute;
  top:-50%; left:-50%;
  width:200%; height:200%;
  background:radial-gradient(circle, rgba(255,215,0,0.8) 0%, transparent 70%);
  animation:pulse 2s infinite;
  z-index:-1;
}
@keyframes pulse{
  0%{transform:scale(0);opacity:1;}
  50%{transform:scale(1);opacity:0.6;}
  100%{transform:scale(0);opacity:1;}
}

.footer{
  margin-top:10px;
  font-size:14px;
  display:flex;
  justify-content:center;
  gap:6px;
}
</style>
</head>
<body>

<div class="overlay">
  <img src="logo.png" class="logo" alt="لوغو الجمعية">

  <button id="newsButton" onclick="location.href='news-misk.html'">
    آخر أخبار مسك الختام
  </button>

  <div class="title">الجمعية الخيرية مسك الختام القرارم قوقة</div>
  <div class="date" id="gregorian">--</div>
  <div class="date" id="hijri">--</div>

  <div id="countdownText">-- بعد:</div>
  <div id="nextPrayerClockContainer">
    <img src="logo.webp" alt="جرس">
    <div id="nextPrayerClock">--:--:--</div>
  </div>

  <div class="table" id="prayerTable"></div>

  <div class="footer">
    <span>misk elkhithem ©</span>
  </div>
</div>

<script>
// ===== بيانات مواقيت الصلاة =====
const TABLE_START_DATE = new Date("2026-02-01T00:00:00");
const prayerSchedule = [
  ["06:09","05:59","12:49","15:40","18:04","19:25"],
  ["06:08","05:58","12:49","15:41","18:05","19:26"],
  ["06:07","05:57","12:49","15:42","18:07","19:27"],
];
const prayerNames=["الفجر","الإمساك","الظهر","العصر","المغرب","العشاء"];
let rows=[], todayTimes=[];

// ===== التاريخ الهجري =====
function updateHijri(){
  const hijriMonths=["محرم","صفر","ربيع الأول","ربيع الثاني","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
  const today=new Date(); today.setHours(0,0,0,0);
  let d=13, m=7, y=1447;
  document.getElementById("hijri").innerText=`${d} ${hijriMonths[m]} ${y} هـ`;
}

// ===== بناء جدول المواقيت =====
function buildTable(){
  const c=document.getElementById("prayerTable");
  c.innerHTML="";
  rows=[];
  prayerNames.forEach((n,i)=>{
    const r=document.createElement("div");
    r.className="row";
    r.innerHTML=`<span>${n}</span><span id="t${i}">--:--</span>`;
    c.appendChild(r);
    rows.push(r);
  });
}

// ===== تحديث التاريخ والوقت =====
function updateDateAndTimes(){
  const now=new Date();
  document.getElementById("gregorian").innerText=
    now.toLocaleDateString("ar-DZ",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  updateHijri();
  todayTimes=prayerSchedule[0];
  todayTimes.forEach((t,i)=>document.getElementById("t"+i).innerText=t);
}

// ===== العد التنازلي للصلاة القادمة =====
function updateCountdown(){
  if(!todayTimes.length) return;
  rows.forEach(r => r.classList.remove("nextPrayer"));
  let target = new Date(); target.setHours(15,40,0,0);
  rows[3].classList.add("nextPrayer");
  const diff = target - new Date();
  const h=Math.floor(diff/3600000), m=Math.floor(diff%3600000/60000), s=Math.floor(diff%60000/1000);
  document.getElementById("countdownText").innerText = `العصر بعد:`;
  document.getElementById("nextPrayerClock").innerText = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

// ===== التشغيل =====
buildTable();
updateDateAndTimes();
updateCountdown();
setInterval(updateCountdown,1000);
</script>

</body>
</html>
