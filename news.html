<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار مسك الختام</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',Tahoma;
  background:#f2f2f2;
  overflow-x:hidden;
}

/* ===== HEADER ===== */
header{
  background:black;
  min-height:210px;
  position:relative;
  color:white;
}

/* شريط الأخبار */
.news-strip{
  position:absolute;
  top:8px;
  left:6px;
  right:6px;
  height:28px;
  background:linear-gradient(90deg,#fff,#f5d36a,#fff);
  border-radius:20px;
  overflow:hidden;
  display:flex;
  align-items:center;
}
.news-strip-text{
  white-space:nowrap;
  font-size:13px;
  font-weight:700;
  color:#000;
  animation:newsMove 18s linear infinite;
}
@keyframes newsMove{
  from{transform:translateX(-100%)}
  to{transform:translateX(100%)}
}

/* اللوغو */
.rotating-logo{
  position:absolute;
  top:58%;
  left:12px;
  width:110px;
  transform:translateY(-50%);
  animation:rotateOncePause 35s linear infinite;
}
@keyframes rotateOncePause{
  0%{transform:translateY(-50%) rotateY(0deg)}
  10%{transform:translateY(-50%) rotateY(360deg)}
  100%{transform:translateY(-50%) rotateY(360deg)}
}

/* العناوين */
.header-main-title{
  position:absolute;
  top:44px;
  right:10px;
  font-size:34px;
  font-weight:900;
}
.header-separator{
  position:absolute;
  top:86px;
  right:10px;
  width:200px;
  height:4px;
  background:white;
}

/* MISK ELKHITHEM */
.header-subtitle{
  position:absolute;
  bottom:42px;
  left:150px;
  line-height:1.05;
}
.header-subtitle span{
  display:block;
  font-size:40px;
  font-weight:900;
  background:linear-gradient(120deg,white,gold,white);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-size:200%;
  animation:shine 10s linear infinite;
}
@keyframes shine{
  from{background-position:200%}
  to{background-position:-200%}
}

/* العنوان الذهبي */
.header-bottom{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  color:gold;
  font-size:16px;
  font-weight:700;
}
.header-bottom::after{content:" ©";}

/* ===== CARDS ===== */
.cards-container{
  display:flex;
  justify-content:center;
  gap:6px;
  padding:10px 6px 6px;
  flex-wrap:wrap;
}
.card{
  width:56px;
  background:black;
  border:2px solid gold;
  border-radius:10px;
  color:white;
  font-size:10px;
  font-weight:900;
  text-align:center;
  padding:6px 4px;
  cursor:pointer;
}

/* خط فاصل */
.section-divider{
  width:90%;
  height:2px;
  background:gold;
  margin:8px auto;
}

/* ===== الأخبار ===== */
.news-section{
  padding:10px;
}

.news-item{
  background:white;
  border-radius:8px;
  padding:8px;
  margin-bottom:8px;
  box-shadow:0 0 5px rgba(0,0,0,.2);
}

.news-date{
  font-size:11px;
  color:#c9a400;
}

.news-title{
  font-weight:900;
  font-size:14px;
  margin:2px 0;
}

.news-text{
  font-size:12px;
}

/* زر الرجوع */
.back-btn{
  display:none;
  margin:10px auto;
  padding:6px 16px;
  background:black;
  color:gold;
  border:2px solid gold;
  border-radius:20px;
  font-weight:900;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div class="news-strip">
    <div class="news-strip-text">
      🔔 خبر: انطلاق حملة قفة رمضان لفائدة العائلات المعوزة
    </div>
  </div>

  <img src="logo1.png" class="rotating-logo">

  <div class="header-main-title">أخبار مسك الختام</div>
  <div class="header-separator"></div>

  <div class="header-subtitle">
    <span>MISK</span>
    <span>ELKHITHEM</span>
  </div>

  <div class="header-bottom">
    الجمعية الخيرية مسك الختام القرارم قوقة
  </div>
</header>

<!-- البطاقات -->
<div class="cards-container">
  <div class="card" onclick="showCategory('أخبار')">أخبار</div>
  <div class="card" onclick="showCategory('أعمال خيرية')">أعمال</div>
  <div class="card" onclick="showCategory('مفقودات')">مفقودات</div>
  <div class="card" onclick="showCategory('نشاطات')">نشاطات</div>
  <div class="card" onclick="showCategory('تبرع')">تبرع</div>
  <div class="card" onclick="showCategory('قفة رمضان')">قفة</div>
  <div class="card" onclick="showCategory('ذكريات')">ذكريات</div>
</div>

<div class="section-divider"></div>

<button class="back-btn" id="backBtn" onclick="showGeneral()">⬅ الرجوع للأخبار العامة</button>

<div class="news-section" id="newsContainer"></div>

<script>
const generalNews=[
 {t:"02/02/2026 10:00",h:"خبر عام 1",c:"هذا مثال لخبر عام يظهر مباشرة"},
 {t:"02/02/2026 12:30",h:"خبر عام 2",c:"خبر آخر خاص بالأخبار العامة"}
];

const categoryNews={
 "أعمال خيرية":[{t:"03/02/2026 11:00",h:"قافلة خيرية",c:"تفاصيل العمل الخيري"}],
 "مفقودات":[{t:"01/02/2026 09:00",h:"إعلان مفقود",c:"تفاصيل المفقود"}],
 "ذكريات":[{t:"2025",h:"ذكرى",c:"ذكريات الجمعية"}]
};

const box=document.getElementById("newsContainer");
const back=document.getElementById("backBtn");

function render(list){
 box.innerHTML="";
 list.forEach(n=>{
  box.innerHTML+=`
   <div class="news-item">
    <div class="news-date">${n.t}</div>
    <div class="news-title">${n.h}</div>
    <div class="news-text">${n.c}</div>
   </div>`;
 });
}

function showGeneral(){
 back.style.display="none";
 render(generalNews);
}

function showCategory(cat){
 back.style.display="block";
 render(categoryNews[cat]||[]);
}

showGeneral();
</script>

</body>
</html>
