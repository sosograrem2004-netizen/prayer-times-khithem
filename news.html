<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار مسك الختام</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',Tahoma;
  background:#f2f2f2;
  overflow-x:hidden;
}

/* ================= HEADER ================= */
header{
  background:black;
  min-height:190px;
  position:relative;
  color:white;
  perspective:1000px;
}

/* ===== شريط الأخبار ===== */
.news-strip{
  position:absolute;
  top:8px;
  left:6px;
  right:6px;
  height:28px;
  background:linear-gradient(
    90deg,
    rgba(255,255,255,0.95),
    rgba(255,215,0,0.35),
    rgba(255,255,255,0.95)
  );
  border-radius:20px;
  overflow:hidden;
  display:flex;
  align-items:center;
  box-shadow:0 0 6px rgba(255,215,0,0.4);
}

.news-strip-text{
  white-space:nowrap;
  font-size:13px;
  font-weight:700;
  color:#000;
  padding-left:-100%;
  animation:newsMove 18s linear infinite;
}

/* من اليسار إلى اليمين + توقف 1 ثانية */
@keyframes newsMove{
  0%{transform:translateX(-100%)}
  90%{transform:translateX(100%)}
  100%{transform:translateX(100%)}
}

/* ===== اللوغو ===== */
.rotating-logo{
  position:absolute;
  top:55%;
  left:10px;
  width:120px;
  transform:translateY(-50%);
  animation:rotateOncePause 35s linear infinite;
  filter:drop-shadow(0 0 10px gold);
}

@keyframes rotateOncePause{
  0%{transform:translateY(-50%) rotateY(0deg)}
  10%{transform:translateY(-50%) rotateY(360deg)}
  100%{transform:translateY(-50%) rotateY(360deg)}
}

/* ===== العناوين ===== */
.header-main-title{
  position:absolute;
  top:44px;
  right:10px;
  font-size:34px;
  font-weight:900;
}

.header-separator{
  position:absolute;
  top:86px;
  right:10px;
  width:180px;
  height:4px;
  background:white;
}

/* MISK فوق ELKHITHEM */
.header-subtitle{
  position:absolute;
  top:58%;
  left:150px;
  transform:translateY(-50%);
  text-align:left;
  line-height:1.05;
}

.header-subtitle span{
  display:block;
  font-size:40px;
  font-weight:900;
  background:linear-gradient(120deg,white 30%,gold 50%,white 70%);
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 10s linear infinite;
}

@keyframes shine{
  0%{background-position:200% center}
  100%{background-position:-200% center}
}

/* ===== العنوان الذهبي ===== */
.header-bottom{
  position:absolute;
  bottom:6px;
  left:50%;
  transform:translateX(-50%);
  color:gold;
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
}
.header-bottom::after{
  content:" ©";
}

/* ================= CARDS ================= */
.cards-container{
  display:flex;
  justify-content:center;
  gap:6px;
  padding:8px 6px;
  flex-wrap:wrap;
}

.card{
  width:54px;
  background:black;
  border:2px solid gold;
  border-radius:10px;
  color:white;
  font-size:10px;
  font-weight:900;
  text-align:center;
  padding:6px 4px;
  cursor:pointer;
}

/* ================= NEWS BOX ================= */
.news-display{
  margin:8px;
  padding:8px;
  background:white;
  border-radius:8px;
  box-shadow:0 0 6px rgba(0,0,0,.25);
  display:none;
}

.news-display.show{display:block}

.news-display h2{
  font-size:15px;
  margin:0;
}

.datetime{
  font-size:10px;
  color:gold;
}

.separator{
  height:2px;
  background:gold;
  margin:4px 0;
}

.news-text{
  font-size:12px;
}

/* ===== MOBILE ===== */
@media(max-width:600px){
  .rotating-logo{width:90px}
  .header-subtitle span{font-size:30px}
  .header-main-title{font-size:24px}
}
</style>
</head>

<body>

<header>

  <!-- شريط الأخبار -->
  <div class="news-strip">
    <div class="news-strip-text">
      🔔 خبر: انطلاق حملة قفة رمضان لفائدة العائلات المعوزة – الجمعية الخيرية مسك الختام
    </div>
  </div>

  <!-- اللوغو -->
  <img src="logo1.png" class="rotating-logo">

  <!-- العناوين -->
  <div class="header-main-title">أخبار مسك الختام</div>
  <div class="header-separator"></div>

  <div class="header-subtitle">
    <span>MISK</span>
    <span>ELKHITHEM</span>
  </div>

  <div class="header-bottom">
    الجمعية الخيرية مسك الختام القرارم قوقة
  </div>

</header>

<div class="cards-container">
  <div class="card" onclick="showNews('أخبار','02/02/2026 10:00','هذا مثال لنص خبر تجريبي')">أخبار</div>
  <div class="card" onclick="showNews('أعمال خيرية','02/02/2026 11:00','نص خبر')">أعمال</div>
  <div class="card" onclick="showNews('مفقودات','02/02/2026 12:00','نص خبر')">مفقودات</div>
  <div class="card" onclick="showNews('نشاطات','02/02/2026 13:00','نص خبر')">نشاطات</div>
  <div class="card" onclick="showNews('تبرع','02/02/2026 14:00','نص خبر')">تبرع</div>
  <div class="card" onclick="showNews('قفة رمضان','02/02/2026 15:00','نص خبر')">قفة</div>
  <div class="card" onclick="showNews('ذكريات','02/02/2026 16:00','نص خبر')">ذكريات</div>
</div>

<div class="news-display" id="newsBox">
  <h2 id="newsTitle"></h2>
  <div class="datetime" id="newsTime"></div>
  <div class="separator"></div>
  <div class="news-text" id="newsText"></div>
</div>

<script>
function showNews(t,d,c){
  document.getElementById('newsTitle').innerText=t;
  document.getElementById('newsTime').innerText=d;
  document.getElementById('newsText').innerText=c;
  document.getElementById('newsBox').classList.add('show');
}
</script>

</body>
</html>
