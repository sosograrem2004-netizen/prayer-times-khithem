<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار مسك الختام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',Tahoma;
  background-color:#f5f5f5;
  overflow-x:hidden;
}

/* ===== الهيدر ===== */
header{
  background-color:black;
  color:white;
  min-height:160px;
  width:100%;
  position:relative;
  box-sizing:border-box;
  padding-bottom:2px;
}

/* اللوجو على اليسار */
header img{
  position:absolute;
  top:15px;
  left:10px;
  width:60px; /* حجم متوسط */
  height:auto;
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.7)); /* لمعة خفيفة */
}

/* عنوان كبير على أقصى اليمين */
.header-main-title{
  position:absolute;
  top:10px;
  right:10px;
  font-size:30px;
  font-weight:900;
  margin:0;
  line-height:1.2;
}

/* الفاصل الأبيض سميك وطويل */
.header-separator{
  position:absolute;
  top:50px;
  right:10px;
  width:150px;
  height:3px;
  background:white;
}

/* misk-elkhithem */
.header-subtitle{
  position:absolute;
  top:60px;
  right:10px;
  font-size:20px;
  font-weight:900;
}

/* الجملة الذهبية أسفل الهيدر */
.header-bottom{
  position:absolute;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  color:gold;
  font-weight:400;
  font-size:8px;
}

/* ===== البطاقات ===== */
.cards-container{
  display:flex;
  justify-content:center;
  gap:6px;
  padding:6px 5px;
  overflow-x:hidden;
  flex-wrap:wrap;
}

.card{
  background-color:black;
  border:2px solid gold;
  border-radius:10px;
  padding:4px 5px;
  color:white;
  font-weight:700;
  font-size:10px;
  text-align:center;
  width:50px;
  flex-shrink:0;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition: transform 0.2s, box-shadow 0.2s;
}

.card .news-title{
  font-weight:900;
  font-size:10px;
}

/* ===== عرض الخبر ===== */
.news-display{
  margin:6px 6px 12px 6px;
  padding:6px 8px;
  background:white;
  border-radius:8px;
  box-shadow:0 0 6px rgba(0,0,0,0.2);
  opacity:0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.news-display.show{
  opacity:1;
  transform: translateY(0);
}

.news-display .title-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:3px;
  flex-wrap:wrap;
}

.news-display .title-bar h2{
  font-size:14px;
  font-weight:900;
  margin:0;
}

.news-display .title-bar .datetime{
  font-size:10px;
  font-weight:400;
  color:gold;
}

.news-display .separator-line{
  height:2px;
  background:gold;
  margin:3px 0;
}

.news-display .content{
  font-size:11px;
  font-weight:400;
  color:black;
}

/* ===== تجاوب ===== */
@media (max-width:600px){
  .header-main-title{
    font-size:24px;
    top:8px;
    right:8px;
  }
  .header-separator{
    width:120px;
    top:45px;
    right:8px;
  }
  .header-subtitle{
    font-size:18px;
    top:55px;
    right:8px;
  }
  .cards-container{
    gap:5px;
    padding:5px 4px;
  }
  .card{
    width:45px;
    font-size:10px;
    padding:3px 4px;
  }
  .news-display{
    margin:5px 5px 10px 5px;
    padding:5px 6px;
  }
  .news-display .title-bar h2{
    font-size:13px;
  }
  .news-display .title-bar .datetime{
    font-size:9px;
  }
  .news-display .content{
    font-size:11px;
  }
}
</style>
</head>
<body>

<header>
  <img src="logo.webp" alt="Logo">
  <h1 class="header-main-title">أخبار مسك الختام</h1>
  <div class="header-separator"></div>
  <span class="header-subtitle">misk-elkhithem</span>
  <div class="header-bottom">الجمعية الخيرية مسك الختام القرارم قوقة</div>
</header>

<!-- البطاقات -->
<div class="cards-container">
  <div class="card" onclick="showNews('أخبار', '02/02/2026 10:00', 'هذا نص الخبر الخاص بالأخبار.')">
    <div class="news-title">أخبار</div>
  </div>
  <div class="card" onclick="showNews('أعمال خيرية', '02/02/2026 11:30', 'هذا نص الخبر الخاص بالأعمال الخيرية.')">
    <div class="news-title">أعمال خيرية</div>
  </div>
  <div class="card" onclick="showNews('مفقودات', '02/02/2026 12:15', 'هذا نص الخبر الخاص بالمفقودات.')">
    <div class="news-title">مفقودات</div>
  </div>
  <div class="card" onclick="showNews('نشاطات الجمعية', '02/02/2026 13:45', 'هذا نص الخبر الخاص بنشاطات الجمعية.')">
    <div class="news-title">نشاطات الجمعية</div>
  </div>
  <div class="card" onclick="showNews('تبرع', '02/02/2026 14:30', 'هذا نص الخبر الخاص بالتبرعات.')">
    <div class="news-title">تبرع</div>
  </div>
  <div class="card" onclick="showNews('قفة رمضان', '02/02/2026 15:00', 'هذا نص الخبر الخاص بقفة رمضان.')">
    <div class="news-title">قفة رمضان</div>
  </div>
</div>

<!-- عرض الخبر -->
<div class="news-display" id="newsDisplay">
  <div class="title-bar">
    <h2 id="newsTitle"></h2>
    <div class="datetime" id="newsDateTime"></div>
  </div>
  <div class="separator-line"></div>
  <div class="content" id="newsContent"></div>
</div>

<script>
function showNews(title, datetime, content){
  const display = document.getElementById('newsDisplay');
  document.getElementById('newsTitle').innerText = title;
  document.getElementById('newsDateTime').innerText = datetime;
  document.getElementById('newsContent').innerText = content;
  display.classList.add('show');
  window.scrollTo({top: display.offsetTop - 20, behavior:'smooth'});
}
</script>

</body>
</html>
