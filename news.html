

<!DOCTYPE html>  <html lang="ar" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>أخبار مسك الختام</title>  
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">  
<style>  
body{  
  margin:0;  
  font-family:'Cairo',Tahoma;  
  background:#f2f2f2;  
  overflow-x:hidden;  
}  
/* ================= HEADER ================= */  
header{  
  background:black;  
  min-height:210px;  
  position:relative;  
  color:white;  
}  
/* شريط الأخبار */  
.news-strip{  
  position:absolute;  
  top:8px;  
  left:6px;  
  right:6px;  
  height:28px;  
  background:linear-gradient(90deg,#fff,#f5d36a,#fff);  
  border-radius:20px;  
  overflow:hidden;  
  display:flex;  
  align-items:center;  
}  
.news-strip-text{  
  white-space:nowrap;  
  font-size:13px;  
  font-weight:700;  
  color:#000;  
  animation:newsMove 18s linear infinite;  
}  
@keyframes newsMove{  
  from{transform:translateX(-100%)}  
  to{transform:translateX(100%)}  
}  
/* اللوغو */  
.rotating-logo{  
  position:absolute;  
  top:58%;  
  left:12px;  
  width:110px;  
  transform:translateY(-50%);  
  animation:rotateOncePause 35s linear infinite;  
}  
@keyframes rotateOncePause{  
  0%{transform:translateY(-50%) rotateY(0deg)}  
  10%{transform:translateY(-50%) rotateY(360deg)}  
  100%{transform:translateY(-50%) rotateY(360deg)}  
}  
/* العناوين */  
.header-main-title{  
  position:absolute;  
  top:40px;  
  right:10px;  
  font-size:26px;   
  font-weight:900;  
}  
.header-separator{  
  position:absolute;  
  top:78px;   
  right:10px;  
  width:180px;  
  height:3px;  
  background:white;  
}  
/* MISK / ELKHITHEM */  
.header-subtitle{  
  position:absolute;  
  bottom:58px;   
  left:150px;  
  line-height:1.15;  
}  
.header-subtitle span{  
  display:block;  
  font-size:32px;   
  font-weight:900;  
  background:linear-gradient(120deg,white,gold,white);  
  -webkit-background-clip:text;  
  -webkit-text-fill-color:transparent;  
  background-size:200%;  
  animation:shine 10s linear infinite;  
}  
@keyframes shine{  
  from{background-position:200%}  
  to{background-position:-200%}  
}  
/* العنوان الذهبي */  
.header-bottom{  
  position:absolute;  
  bottom:10px;  
  left:50%;  
  transform:translateX(-50%);  
  color:gold;  
  font-size:12px; /* تصغير الخط */  
  font-weight:700;  
  white-space:nowrap; /* سطر واحد */  
}  
.header-bottom::after{content:" ©";}  
/* ================= CARDS ================= */  
.cards-container{  
  display:flex;  
  justify-content:center;  
  gap:6px;  
  padding:10px 6px;  
  flex-wrap:wrap;  
}  
.card{  
  width:80px;       /* أوسع عرضًا */  
  height:40px;      /* أقصر طولًا */  
  background:black;  
  border:2px solid gold;  
  border-radius:10px;  
  color:white;  
  font-size:9px;      
  font-weight:900;  
  text-align:center;  
  padding:4px 2px;  
  cursor:pointer;  
  display:flex;  
  align-items:center;  
  justify-content:center;  
}  
/* ===== زر الرجوع ===== */  
.back-btn{  
  display:none;  
  width:92%;  
  margin:10px auto;  
  padding:10px;  
  background:black;  
  color:gold;  
  border:2px solid gold;  
  border-radius:30px;  
  font-weight:900;  
  font-size:14px;  
  cursor:pointer;  
}  
/* ================= NEWS BOX ================= */  
.news-display{  
  margin:8px;  
  padding:8px;  
  background:white;  
  border-radius:8px;  
  box-shadow:0 0 6px rgba(0,0,0,.25);  
}  
.news-item{  
  margin-bottom:10px;  
}  
.news-item h2{  
  font-size:15px;  
  margin:0;  
}  
.datetime{  
  font-size:10px;  
  color:gold;  
}  
.separator{  
  height:2px;  
  background:gold;  
  margin:4px 0;  
}  
.news-text{  
  font-size:12px;  
}  
</style>  
</head>  
<body>  
<header>  
  <div class="news-strip">  
    <div class="news-strip-text">  
      🔔 خبر: انطلاق حملة قفة رمضان 2026 لفائدة العائلات المعوزة – الجمعية الخيرية مسك الختام  
    </div>  
  </div>  
  <img src="logo1.png" class="rotating-logo">  
  <div class="header-main-title">أخبار مسك الختام</div>  
  <div class="header-separator"></div>  
  <div class="header-subtitle">  
    <span>MISK</span>  
    <span>ELKHITHEM</span>  
  </div>  
  <div class="header-bottom">  
    الجمعية الخيرية مسك الختام القرارم قوقة  
  </div>  
</header>  
<div class="cards-container">  
  <div class="card" onclick="showCategory('general')">أخبار</div>  
  <div class="card" onclick="showCategory('charity')">أعمال خيرية</div> 
  <div class="card" onclick="showCategory('missing')">مفقودات</div>  
  <div class="card" onclick="showCategory('activities')">نشاطات</div>  
  <div class="card" onclick="showCategory('donate')">تبرع</div>  
  <div class="card" onclick="showCategory('ramadan')">قفة</div>  
  <div class="card" onclick="showCategory('memory')">ذكريات</div>  
</div>  
<button class="back-btn" id="backBtn" onclick="showGeneral()">⬅ الرجوع إلى الأخبار العامة</button>  
<div class="news-display" id="newsBox"></div>  
<script>  
const newsData = {  
  general: [  
    {t:"02/02/2026 10:00", h:"خبر عام", c:"هذا مثال لخبر عام يظهر مباشرة عند فتح الصفحة"}  
  ],  
  charity: [  
    {t:"03/02/2026 11:00", h:"عمل خيري", c:"تفاصيل عمل خيري"}  
  ],  
  missing: [  
    {t:"01/02/2026 09:00", h:"إعلان مفقود", c:"تفاصيل إعلان مفقود"}  
  ],  
  activities: [  
    {t:"04/02/2026 14:00", h:"نشاط", c:"تفاصيل نشاط الجمعية"}  
  ],  
  donate: [  
    {t:"05/02/2026 15:30", h:"تبرعات", c:"كيفية التبرع"}  
  ],  
  ramadan: [  
    {t:"06/02/2026 16:00", h:"قفة رمضان", c:"تفاصيل قفة رمضان"}  
  ],  
  memory: [  
    {t:"2025", h:"ذكرى", c:"ذكريات الجمعية"}  
  ]  
};  
const box = document.getElementById("newsBox");  
const backBtn = document.getElementById("backBtn");  
function renderNews(list){  
  box.innerHTML="";  
  list.forEach(n=>{  
    box.innerHTML += `  
      <div class="news-item">  
        <div class="datetime">${n.t}</div>  
        <h2>${n.h}</h2>  
        <div class="separator"></div>  
        <div class="news-text">${n.c}</div>  
      </div>  
    `;  
  });  
}  
function showGeneral(){  
  backBtn.style.display="none";  
  renderNews(newsData.general);  
}  
function showCategory(cat){  
  backBtn.style.display="block";  
  renderNews(newsData[cat]);  
}  
showGeneral();  
</script>  
</body>  
</html>
