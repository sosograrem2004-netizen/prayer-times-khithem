<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار مسك الختام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:'Cairo',Tahoma;
  background:#f2f2f2;
  overflow-x:hidden;
}
/* ================= HEADER ================= */
header{
  background:black;
  min-height:210px;
  position:relative;
  color:white;
}
/* شريط الأخبار */
.news-strip{
  position:absolute;
  top:8px;
  left:6px;
  right:6px;
  height:28px;
  background:linear-gradient(90deg,#fff,#f5d36a,#fff);
  border-radius:20px;
  overflow:hidden;
  display:flex;
  align-items:center;
}
.news-strip-text{
  white-space:nowrap;
  font-size:13px;
  font-weight:700;
  color:#000;
  animation:newsMove 18s linear infinite;
}
@keyframes newsMove{
  from{transform:translateX(-100%)}
  to{transform:translateX(100%)}
}
/* ================= CARDS ================= */
.cards-container{
  display:flex;
  justify-content:center;
  gap:6px;
  padding:10px 6px;
  flex-wrap:wrap;
}
.card{
  width:80px;
  height:40px;
  background:black;
  border:2px solid gold;
  border-radius:10px;
  color:white;
  font-size:9px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
/* زر الرجوع */
.back-btn{
  display:none;
  width:92%;
  margin:10px auto;
  padding:10px;
  background:black;
  color:gold;
  border:2px solid gold;
  border-radius:30px;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
}
/* ================= NEWS BOX ================= */
.news-display{
  margin:8px;
  padding:8px;
  background:white;
  border-radius:8px;
  box-shadow:0 0 6px rgba(0,0,0,.25);
}
.news-item{
  margin-bottom:14px;
}
.news-item h2{
  font-size:15px;
  margin:0;
  font-weight:900;
}
.datetime{
  font-size:10px;
  color:gold;
}
.separator{
  height:2px;
  background:gold;
  margin:6px 0;
}
.news-text{
  font-size:12px;
  line-height:1.7;
}
</style>
</head>
<body>

<header>
  <div class="news-strip">
    <div class="news-strip-text">
      🔔 نداء مستعجل للتبرع بالدم – الجمعية الخيرية مسك الختام
    </div>
  </div>
</header>

<div class="cards-container">
  <div class="card" onclick="showCategory('general')">أخبار</div>
  <div class="card" onclick="showCategory('charity')">أعمال خيرية</div>
  <div class="card" onclick="showCategory('missing')">مفقودات</div>
  <div class="card" onclick="showCategory('activities')">نشاطات</div>
  <div class="card" onclick="showCategory('donate')">تبرع</div>
</div>

<button class="back-btn" id="backBtn" onclick="showGeneral()">⬅ الرجوع إلى الأخبار العامة</button>

<div class="news-display" id="newsBox"></div>

<script>
const newsData = {
  general:[
    {t:"07/02/2026 16:30", h:"أخبار الجمعية", c:"مرحبا بكم في صفحة الأخبار العامة للجمعية الخيرية مسك الختام."}
  ],
  charity:[
    {t:"03/02/2026 11:00", h:"عمل خيري", c:"تفاصيل عمل خيري"}
  ],
  missing:[
    {t:"01/02/2026 09:00", h:"إعلان مفقود", c:"تفاصيل إعلان مفقود"}
  ],
  activities:[
    {t:"04/02/2026 14:00", h:"نشاط", c:"تفاصيل نشاط الجمعية"}
  ],
  donate:[
    {t:"08/02/2026 09:00", h:"🚨 نداء مستعجل للتبرع بالدم 🚨", c:`
      مريض من بلديتنا في حاجة ماسة وعاجلة إلى دم من فصيلة <b>A+</b>.<br><br>
      📍 متواجد بـ <b>مستشفى الإخوة طوبال – ميلة</b><br><br>
      نرجو من كل من تتوفر لديه هذه الفصيلة التوجه في أقرب وقت ممكن للتبرع، فالأمر مستعجل جدًا وقد ينقذ حياة إنسان.<br><br>
      📞 للاستفسار والتنسيق: <b>0792844621</b><br><br>
      قال رسول الله ﷺ: «ومن أحياها فكأنما أحيا الناس جميعًا»<br><br>
      جزاكم الله خيرًا وبارك فيكم 🤍<br>
      🔁 الرجاء مشاركة المنشور على أوسع نطاق
    `}
  ]
};

const box = document.getElementById("newsBox");
const backBtn = document.getElementById("backBtn");

function renderNews(list){
  box.innerHTML="";
  if(!list || list.length===0){
    box.innerHTML="<p>لا توجد أخبار حالياً</p>";
    return;
  }
  list.forEach(n=>{
    box.innerHTML+=`
      <div class="news-item">
        <div class="datetime">${n.t}</div>
        <h2>${n.h}</h2>
        <div class="separator"></div>
        <div class="news-text">${n.c}</div>
      </div>
    `;
  });
}

function showGeneral(){
  backBtn.style.display="none";
  renderNews(newsData.general);
}

function showCategory(cat){
  backBtn.style.display="block";
  renderNews(newsData[cat]);
}

/* عند فتح الصفحة */
showGeneral();
</script>

</body>
</html>
