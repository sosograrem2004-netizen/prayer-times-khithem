<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار مسك الختام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',Tahoma;
  background-color:#f5f5f5;
}

/* ===== الهيدر ===== */
header{
  background-color:black;
  color:white;
  padding:15px 20px;
  position:relative;
  min-height:120px;
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}

.header-right{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.header-right h1{
  font-size:28px;
  font-weight:900;
  margin:0;
}

.header-right span{
  font-size:28px;
  font-weight:900;
  display:flex;
  align-items:center;
}

.header-right .separator{
  width:2px;
  height:30px;
  background-color:white;
  display:inline-block;
}

/* الجملة الذهبية أسفل الهيدر */
.header-bottom{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  color:gold;
  font-weight:400;
  font-size:8px;
  padding-bottom:2px;
}

/* ===== البطاقات ===== */
.cards-container{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:15px 20px;
  overflow-x:auto;
  scroll-behavior:smooth;
}

.card{
  background-color:black;
  border:2px solid gold;
  border-radius:12px;
  padding:5px 10px;
  color:white;
  font-weight:700;
  font-size:12px;
  text-align:center;
  width:90px; /* صغيرة جدًا */
  flex-shrink:0; /* لمنع التصغير على الشاشات الصغيرة */
  cursor:pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.card:hover{
  transform: translateY(-3px);
  box-shadow:0 0 8px gold;
}

.card .news-title{
  font-weight:900;
  font-size:12px;
}

/* ===== عرض الخبر ===== */
.news-display{
  margin:20px;
  padding:15px;
  background:white;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
  display:none;
  opacity:0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  position:relative;
  z-index:10;
}

.news-display.show{
  display:block;
  opacity:1;
  transform: translateY(0);
}

.news-display .title-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
  flex-wrap:wrap;
}

.news-display .title-bar h2{
  font-size:18px;
  font-weight:900;
  margin:0;
}

.news-display .title-bar .datetime{
  font-size:12px;
  font-weight:400;
  color:gold;
}

.news-display .separator-line{
  height:2px;
  background:gold;
  margin:5px 0;
}

.news-display .content{
  font-size:14px;
  font-weight:400;
  color:black;
}

/* ===== غطاء للتعتيم خارج الصندوق ===== */
.overlay-bg{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.2);
  z-index:5;
}

/* ===== تجاوب ===== */
@media (max-width:600px){
  .cards-container{
    gap:8px;
    padding:10px;
  }

  .card{
    width:80px;
    font-size:11px;
    padding:4px 8px;
  }

  .header-right h1, .header-right span{
    font-size:22px;
  }

  .news-display .title-bar h2{
    font-size:16px;
  }
}
</style>
</head>
<body>

<header>
  <div class="header-right">
    <h1>أخبار مسك الختام</h1>
    <span class="separator"></span>
    <span>misk-elkhithem</span>
  </div>
  <div class="header-bottom">
    الجمعية الخيرية مسك الختام القرارم قوقة
  </div>
</header>

<!-- البطاقات الصغيرة القابلة للضغط -->
<div class="cards-container">
  <div class="card" onclick="showNews('أخبار', '02/02/2026 10:00', 'هذا نص الخبر الخاص بالأخبار.')">
    <div class="news-title">أخبار</div>
  </div>
  <div class="card" onclick="showNews('أعمال خيرية', '02/02/2026 11:30', 'هذا نص الخبر الخاص بالأعمال الخيرية.')">
    <div class="news-title">أعمال خيرية</div>
  </div>
  <div class="card" onclick="showNews('مفقودات', '02/02/2026 12:15', 'هذا نص الخبر الخاص بالمفقودات.')">
    <div class="news-title">مفقودات</div>
  </div>
  <div class="card" onclick="showNews('نشاطات الجمعية', '02/02/2026 13:45', 'هذا نص الخبر الخاص بنشاطات الجمعية.')">
    <div class="news-title">نشاطات الجمعية</div>
  </div>
  <div class="card" onclick="showNews('تبرع', '02/02/2026 14:30', 'هذا نص الخبر الخاص بالتبرعات.')">
    <div class="news-title">تبرع</div>
  </div>
  <div class="card" onclick="showNews('قفة رمضان', '02/02/2026 15:00', 'هذا نص الخبر الخاص بقفة رمضان.')">
    <div class="news-title">قفة رمضان</div>
  </div>
</div>

<!-- غطاء لتعتيم الخلفية عند عرض الخبر -->
<div class="overlay-bg" id="overlayBg" onclick="closeNews()"></div>

<!-- عرض الخبر -->
<div class="news-display" id="newsDisplay">
  <div class="title-bar">
    <h2 id="newsTitle"></h2>
    <div class="datetime" id="newsDateTime"></div>
  </div>
  <div class="separator-line"></div>
  <div class="content" id="newsContent"></div>
</div>

<script>
function showNews(title, datetime, content){
  const display = document.getElementById('newsDisplay');
  const overlay = document.getElementById('overlayBg');
  document.getElementById('newsTitle').innerText = title;
  document.getElementById('newsDateTime').innerText = datetime;
  document.getElementById('newsContent').innerText = content;

  overlay.style.display = 'block';
  display.classList.remove('show');
  display.offsetWidth; // إعادة تفعيل التحريك
  display.classList.add('show');
  window.scrollTo({top: display.offsetTop - 100, behavior:'smooth'});
}

function closeNews(){
  const display = document.getElementById('newsDisplay');
  const overlay = document.getElementById('overlayBg');
  display.classList.remove('show');
  overlay.style.display = 'none';
}
</script>

</body>
</html>
