<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار مسك الختام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',Tahoma;
  background-color:#f5f5f5;
  overflow-x:hidden;
}

/* ===== الهيدر ===== */
header{
  background-color:black;
  color:white;
  padding:8px 10px;
  min-height:130px;
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  position:relative;
  box-sizing:border-box;
}

.header-right{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.header-right h1{
  font-size:18px; /* تصغير العنوان */
  font-weight:900;
  margin:0;
}

.header-right span{
  font-size:18px; /* تصغير misk-elkhithem */
  font-weight:900;
  display:flex;
  align-items:center;
}

.header-right .separator{
  width:1px;
  height:20px;
  background-color:white;
  display:inline-block;
}

/* الجملة الذهبية أسفل الهيدر */
.header-bottom{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  color:gold;
  font-weight:400;
  font-size:8px;
  padding-bottom:2px;
}

/* ===== البطاقات ===== */
.cards-container{
  display:flex;
  justify-content:center;
  gap:3px;
  padding:5px 5px;
  overflow-x:hidden; /* منع التمرير الأفقي */
  flex-wrap:wrap; /* لتتناسب البطاقات في سطر واحد على الهواتف */
}

.card{
  background-color:black;
  border:1px solid gold;
  border-radius:8px;
  padding:2px 3px;
  color:white;
  font-weight:700;
  font-size:9px; /* تصغير النص */
  text-align:center;
  width:40px; /* تصغير أكبر */
  flex-shrink:0;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.card .news-title{
  font-weight:900;
  font-size:9px;
}

/* ===== عرض الخبر ===== */
.news-display{
  margin:5px 5px 10px 5px;
  padding:5px 8px;
  background:white;
  border-radius:8px;
  box-shadow:0 0 6px rgba(0,0,0,0.2);
  opacity:0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.news-display.show{
  opacity:1;
  transform: translateY(0);
}

.news-display .title-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:3px;
  flex-wrap:wrap;
}

.news-display .title-bar h2{
  font-size:14px;
  font-weight:900;
  margin:0;
}

.news-display .title-bar .datetime{
  font-size:10px;
  font-weight:400;
  color:gold;
}

.news-display .separator-line{
  height:2px;
  background:gold;
  margin:3px 0;
}

.news-display .content{
  font-size:11px;
  font-weight:400;
  color:black;
}

/* ===== تجاوب ===== */
@media (max-width:600px){
  header{
    min-height:130px;
    padding:6px 8px;
  }

  .header-right h1, .header-right span{
    font-size:16px;
  }

  .header-right .separator{
    height:18px;
  }

  .cards-container{
    gap:2px;
    padding:4px 4px;
  }

  .card{
    width:35px; /* أصغر حجم للهواتف */
    font-size:8px;
    padding:1px 2px;
  }

  .news-display{
    margin:4px 4px 8px 4px;
    padding:4px 6px;
  }

  .news-display .title-bar h2{
    font-size:12px;
  }

  .news-display .title-bar .datetime{
    font-size:9px;
  }

  .news-display .content{
    font-size:10px;
  }
}
</style>
</head>
<body>

<header>
  <div class="header-right">
    <h1>أخبار مسك الختام</h1>
    <span class="separator"></span>
    <span>misk-elkhithem</span>
  </div>
  <div class="header-bottom">
    الجمعية الخيرية مسك الختام القرارم قوقة
  </div>
</header>

<!-- البطاقات الصغيرة جدًا -->
<div class="cards-container">
  <div class="card" onclick="showNews('أخبار', '02/02/2026 10:00', 'هذا نص الخبر الخاص بالأخبار.')">
    <div class="news-title">أخبار</div>
  </div>
  <div class="card" onclick="showNews('أعمال خيرية', '02/02/2026 11:30', 'هذا نص الخبر الخاص بالأعمال الخيرية.')">
    <div class="news-title">أعمال خيرية</div>
  </div>
  <div class="card" onclick="showNews('مفقودات', '02/02/2026 12:15', 'هذا نص الخبر الخاص بالمفقودات.')">
    <div class="news-title">مفقودات</div>
  </div>
  <div class="card" onclick="showNews('نشاطات الجمعية', '02/02/2026 13:45', 'هذا نص الخبر الخاص بنشاطات الجمعية.')">
    <div class="news-title">نشاطات الجمعية</div>
  </div>
  <div class="card" onclick="showNews('تبرع', '02/02/2026 14:30', 'هذا نص الخبر الخاص بالتبرعات.')">
    <div class="news-title">تبرع</div>
  </div>
  <div class="card" onclick="showNews('قفة رمضان', '02/02/2026 15:00', 'هذا نص الخبر الخاص بقفة رمضان.')">
    <div class="news-title">قفة رمضان</div>
  </div>
</div>

<!-- عرض الخبر -->
<div class="news-display" id="newsDisplay">
  <div class="title-bar">
    <h2 id="newsTitle"></h2>
    <div class="datetime" id="newsDateTime"></div>
  </div>
  <div class="separator-line"></div>
  <div class="content" id="newsContent"></div>
</div>

<script>
function showNews(title, datetime, content){
  const display = document.getElementById('newsDisplay');
  document.getElementById('newsTitle').innerText = title;
  document.getElementById('newsDateTime').innerText = datetime;
  document.getElementById('newsContent').innerText = content;
  display.classList.add('show');
  window.scrollTo({top: display.offsetTop - 20, behavior:'smooth'});
}
</script>

</body>
</html>
